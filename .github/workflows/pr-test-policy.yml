name: PR test policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR test policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'merge_group') {
              core.info('PR review/test-change policy is evaluated before queue entry; CI checks combined changed-line coverage.');
              return;
            }
            const { enforce } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/pr-test-policy.mjs`);
            await enforce({ github, context, core });
