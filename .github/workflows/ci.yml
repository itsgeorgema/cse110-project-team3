name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Preserve each quality run so the reusable smoke job can complete. Main
  # deployments are serialized separately in cd.yml.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  gate:
    name: CI gate
    if: always() && !cancelled()
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality stage to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success

  deploy:
    name: Deploy tested site
    needs: gate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/cd.yml
