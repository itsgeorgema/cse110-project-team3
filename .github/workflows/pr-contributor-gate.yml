name: PR contributor gate

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check contributor allowlist
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = '.github/CONTRIBUTORS';
            const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: context.payload.repository.default_branch });
            if (Array.isArray(data) || !data.content) {
              throw new Error(`${path} must be a file on the default branch`);
            }
            const allowed = Buffer.from(data.content, data.encoding)
              .toString('utf8')
              .split(/\r?\n/)
              .map((line) => line.trim().replace(/^@/, '').toLowerCase())
              .filter((line) => line && !line.startsWith('#'));
            const author = context.payload.pull_request.user.login.toLowerCase();
            if (allowed.includes(author)) {
              core.info(`@${author} is an allowed contributor.`);
              return;
            }
            const message = `This repository accepts pull requests from listed contributors only. @${author} is not listed in .github/CONTRIBUTORS, so this pull request is being closed.`;
            await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body: message });
            await github.rest.pulls.update({ owner, repo, pull_number: context.issue.number, state: 'closed' });
            core.notice(`Closed pull request from non-listed contributor @${author}.`);
