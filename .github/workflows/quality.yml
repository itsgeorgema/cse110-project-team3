name: Quality checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: true

jobs:
  fast:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:browser:types
      - run: npm run test:ci-policy
      - run: npm run test:coverage
      - name: Require coverage on changed logic
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: npm run test:coverage:changed -- "$BASE_SHA"
      - name: Reject critical dependency vulnerabilities (#28)
        run: npm audit --audit-level=critical
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  smoke:
    name: Production build and Chromium smoke
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright builds dist/ with the Pages base path and tests that exact build.
      - run: npm run test:smoke
      - name: Preserve the tested site
        uses: actions/upload-artifact@v4
        with:
          name: tested-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
