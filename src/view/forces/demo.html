<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Body Diagram Demo</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f4ead2;
        color: #162c34;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 16px;

        height: 640px;

  <body>
    <h1>Free body diagram demo (#96)</h1>

    <p>
      <button id="toggle" type="button">
        Show pushed crate after answering
      </button>

    <div id="stage"></div>
    <p id="error" role="alert"></p>
    <script type="module" src="./demoPage.ts"></script>
